name: OpenAPI Diff

on:
  push:
    branches:
      - develop

jobs:
  diff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run OpenAPI Diff
        run: |
          docker run --rm \
          -v ${{ github.workspace }}:/specs \
          openapitools/openapi-diff:latest \
          /specs/openapi_specs/openapi_old.yaml \
          /specs/openapi_specs/openapi_new.yaml > diff_result.txt

      - name: Show diff result
        run: cat diff_result.txt

      - name: Send diff result to n8n
        run: |
          RESULT=$(cat diff_result.txt | jq -Rs .)
          curl -X POST https://n8n-learning.app.n8n.cloud/webhook/api-diff-result \
          -H "Content-Type: application/json" \
          -d "{\"diff\": $RESULT}"